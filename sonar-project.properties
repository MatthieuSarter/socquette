sonar.projectKey=MatthieuSarter:socquette
sonar.projectName=MatthieuSarter:socquette
sonar.projectBaseDir=.
sonar.projectVersion=0.2.0

sonar.sources=.
sonar.exclusions=**/*_test.go,docs/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Written by the check job of .forgejo/workflows/ci.yaml (just coverage), with paths relative to the repository root.
sonar.go.coverage.reportPaths=.reports/coverage.out
# Same exclusions as the 80% coverage gate (just coverage): the GUI, service/platform, assets and entry-point shells.
sonar.coverage.exclusions=internal/gui/**,internal/control/**,internal/assets/**,main.go
